version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: entity_user
      POSTGRES_PASSWORD: entity_password
      POSTGRES_DB: entity_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U entity_user"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Entity API Service
  entity-api:
    build: .
    ports:
      - "8003:8003"
    environment:
      DATABASE_URL: postgresql+asyncpg://entity_user:entity_password@postgres:5432/entity_db
      LOG_LEVEL: INFO
      DB_ECHO: "false"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - .:/app
    command: uvicorn main:app --reload --host 0.0.0.0 --port 8003

volumes:
  postgres_data:
